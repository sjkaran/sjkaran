<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img">
<style>text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes dash{to{stroke-dashoffset:-20}}.fl{stroke-dasharray:4 6;animation:dash 1.5s linear infinite}@keyframes pop{50%{transform:scale(1.5);opacity:.4}}.sat{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-in-out infinite}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1226"/><stop offset="1" stop-color="#141B3B"/></linearGradient></defs>
<rect width="1000" height="300" rx="18" fill="url(#bg)"/><rect x=".5" y=".5" width="999" height="299" rx="18" fill="none" stroke="#2A3365"/><line class="fl" x1="230" y1="150" x2="70" y2="60" stroke="#2A3365" stroke-width="1.5"/><line class="fl" x1="230" y1="150" x2="110" y2="240" stroke="#2A3365" stroke-width="1.5"/><line class="fl" x1="230" y1="150" x2="380" y2="50" stroke="#2A3365" stroke-width="1.5"/><line class="fl" x1="230" y1="150" x2="400" y2="225" stroke="#2A3365" stroke-width="1.5"/><line class="fl" x1="230" y1="150" x2="330" y2="150" stroke="#2A3365" stroke-width="1.5"/><line class="fl" x1="230" y1="150" x2="150" y2="150" stroke="#2A3365" stroke-width="1.5"/><line class="fl" x1="230" y1="150" x2="250" y2="265" stroke="#2A3365" stroke-width="1.5"/><line class="fl" x1="230" y1="150" x2="290" y2="35" stroke="#2A3365" stroke-width="1.5"/><circle class="sat" style="animation-delay:0.0s" cx="70" cy="60" r="6" fill="#3EE0D0"/><circle class="sat" style="animation-delay:0.4s" cx="110" cy="240" r="6" fill="#9B8CFF"/><circle class="sat" style="animation-delay:0.8s" cx="380" cy="50" r="6" fill="#FFB454"/><circle class="sat" style="animation-delay:1.2000000000000002s" cx="400" cy="225" r="6" fill="#FF7A9C"/><circle class="sat" style="animation-delay:1.6s" cx="330" cy="150" r="6" fill="#3EE0D0"/><circle class="sat" style="animation-delay:2.0s" cx="150" cy="150" r="6" fill="#9B8CFF"/><circle class="sat" style="animation-delay:2.4000000000000004s" cx="250" cy="265" r="6" fill="#FFB454"/><circle class="sat" style="animation-delay:2.8000000000000003s" cx="290" cy="35" r="6" fill="#FF7A9C"/><line class="fl" x1="230" y1="150" x2="95" y2="105" stroke="#3EE0D0" stroke-width="2"/><line class="fl" x1="230" y1="150" x2="350" y2="105" stroke="#FFB454" stroke-width="2"/><circle cx="230" cy="150" r="44" fill="#0C1226" stroke="#3EE0D0" stroke-width="2"/><circle cx="230" cy="150" r="44" fill="none" stroke="#3EE0D0" stroke-opacity=".5"><animate attributeName="r" values="44;70" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="2.6s" repeatCount="indefinite"/></circle><text x="230" y="155" text-anchor="middle" font-size="13" font-weight="800" fill="#E8ECFF">campus-cod</text><rect x="40" y="92" width="116" height="26" rx="13" fill="#0C1226" stroke="#3EE0D0"/><text x="98" y="109" text-anchor="middle" class="m" font-size="13" fill="#3EE0D0">hod_desktop</text><rect x="280" y="92" width="158" height="26" rx="13" fill="#0C1226" stroke="#FFB454"/><text x="359" y="109" text-anchor="middle" class="m" font-size="13" fill="#FFB454">prompts_to_build</text><text x="520" y="100" font-size="34" font-weight="800" fill="#E8ECFF">campus-cod</text><text x="520" y="136" font-size="19" fill="#3EE0D0">A campus automation system.</text><text x="520" y="180" font-size="16" fill="#E8ECFF">Two folders so far: hod_desktop and prompts_to_build.</text><text x="520" y="210" font-size="16" fill="#E8ECFF">Early days, and the one I am building right now.</text><text x="520" y="240" font-size="16" fill="#8D97C4">Next to it sits LiveliHood, where I could use a hand.</text>
</svg>