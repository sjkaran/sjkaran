<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img">
<style>text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.b{transform-box:fill-box;transform-origin:center;animation:eq 1s ease-in-out infinite}
@keyframes dash{to{stroke-dashoffset:-24}}.fl{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C1226"/><stop offset="1" stop-color="#141B3B"/></linearGradient></defs>
<rect width="1000" height="350" rx="18" fill="url(#bg)"/><rect x=".5" y=".5" width="999" height="349" rx="18" fill="none" stroke="#2A3365"/><text x="40" y="52" font-size="28" font-weight="800" fill="#E8ECFF">receptionist_ai</text><text x="40" y="78" font-size="15" fill="#8D97C4">A trainable voice receptionist. Visitors speak, it answers from the Q&amp;A you taught it.</text><path class="fl" d="M190 175 H250" fill="none" stroke="#3EE0D0" stroke-width="2" stroke-opacity=".7"/><path class="fl" d="M400 175 H460" fill="none" stroke="#3EE0D0" stroke-width="2" stroke-opacity=".7"/><path class="fl" d="M640 175 H800" fill="none" stroke="#9B8CFF" stroke-width="2" stroke-opacity=".7"/><path class="fl" d="M550 207 V285 H610" fill="none" stroke="#FFB454" stroke-width="2" stroke-opacity=".7"/><path class="fl" d="M790 285 H880 V207" fill="none" stroke="#FFB454" stroke-width="2" stroke-opacity=".7"/><text x="720" y="163" text-anchor="middle" font-size="13" fill="#9B8CFF">already taught</text><text x="562" y="250" font-size="13" fill="#FFB454">not taught yet</text><circle r="6" fill="#9B8CFF" opacity="0"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M190 175 H800"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="4s" begin="0s" repeatCount="indefinite"/></circle><circle r="6" fill="#FFB454" opacity="0"><animateMotion dur="7s" begin="2s" repeatCount="indefinite" path="M190 175 H550 V285 H880 V207"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.95;1" dur="7s" begin="2s" repeatCount="indefinite"/></circle><rect x="40" y="143" width="150" height="64" rx="14" fill="#0C1226" stroke="#3EE0D0" stroke-opacity=".8"/><text x="115.0" y="180.0" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECFF">Visitor speaks</text><rect class="b" style="animation-delay:0.0s" x="68" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect class="b" style="animation-delay:0.13s" x="80" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect class="b" style="animation-delay:0.26s" x="92" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect class="b" style="animation-delay:0.39s" x="104" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect class="b" style="animation-delay:0.52s" x="116" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect class="b" style="animation-delay:0.65s" x="128" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect class="b" style="animation-delay:0.78s" x="140" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect class="b" style="animation-delay:0.91s" x="152" y="187" width="5" height="14" rx="2.5" fill="#3EE0D0"/><rect x="250" y="143" width="150" height="64" rx="14" fill="#0C1226" stroke="#3EE0D0" stroke-opacity=".8"/><text x="325.0" y="180.0" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECFF">Speech to text</text><rect x="460" y="143" width="180" height="64" rx="14" fill="#0C1226" stroke="#9B8CFF" stroke-opacity=".8"/><text x="550.0" y="172.0" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECFF">Fuzzy matching</text><text x="550.0" y="191.0" text-anchor="middle" font-size="12" fill="#8D97C4">on your trained Q&amp;A</text><rect x="610" y="253" width="180" height="64" rx="14" fill="#0C1226" stroke="#FFB454" stroke-opacity=".8"/><text x="700.0" y="282.0" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECFF">Local Ollama</text><text x="700.0" y="301.0" text-anchor="middle" font-size="12" fill="#8D97C4">mistral model</text><rect x="800" y="143" width="160" height="64" rx="14" fill="#0C1226" stroke="#3EE0D0" stroke-opacity=".8"/><text x="880.0" y="180.0" text-anchor="middle" font-size="15" font-weight="700" fill="#E8ECFF">Spoken reply</text><text x="40" y="335" font-size="13" fill="#8D97C4">Next upgrade ideas: semantic matching, offline speech-to-text, barge-in, visitor intake, multi-language.</text>
</svg>